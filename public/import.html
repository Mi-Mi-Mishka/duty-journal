<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Импорт данных</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-upload me-2"></i>Импорт данных из JSON</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Выберите экспортированный JSON-файл из старой версии проекта:</p>
                <input type="file" class="form-control mb-3" id="importFile" accept=".json">
                <div id="progress" class="mt-3" style="display: none;">
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                    </div>
                    <p class="mt-2 text-center" id="progressText"></p>
                </div>
                <button class="btn btn-primary w-100" id="importBtn" disabled>
                    <i class="bi bi-cloud-upload me-2"></i>Выберите файл
                </button>
            </div>
            <div class="card-footer bg-white">
                <div id="result" class="small text-muted text-center"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const fileInput = document.getElementById('importFile');
        const importBtn = document.getElementById('importBtn');
        const progress = document.getElementById('progress');
        const progressBar = progress.querySelector('.progress-bar');
        const progressText = document.getElementById('progressText');
        const resultDiv = document.getElementById('result');

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                importBtn.disabled = false;
                importBtn.innerHTML = '<i class="bi bi-cloud-upload me-2"></i>Импортировать данные';
                resultDiv.innerHTML = '';
            } else {
                importBtn.disabled = true;
                importBtn.innerHTML = '<i class="bi bi-cloud-upload me-2"></i>Выберите файл';
            }
        });

        importBtn.addEventListener('click', async function() {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    progress.style.display = 'block';
                    importBtn.disabled = true;
                    
                    const results = { journal: 0, vacations: 0, birthdays: 0 };
                    let total = 0;
                    
                    if (data.data && data.data.journal) total += data.data.journal.length;
                    if (data.data && data.data.vacations) total += data.data.vacations.length;
                    if (data.data && data.data.birthdays) total += data.data.birthdays.length;
                    
                    let completed = 0;
                    
                    // Импорт журнала
                    if (data.data && data.data.journal) {
                        for (let entry of data.data.journal) {
                            try {
                                await apiAddJournalEntry(entry);
                                results.journal++;
                            } catch(e) { console.error('Ошибка:', e); }
                            completed++;
                            progressBar.style.width = `${(completed / total) * 100}%`;
                            progressText.textContent = `Импорт: ${results.journal} записей журнала, ${results.vacations} отпусков, ${results.birthdays} сотрудников`;
                        }
                    }
                    
                    // Импорт отпусков
                    if (data.data && data.data.vacations) {
                        for (let vacation of data.data.vacations) {
                            try {
                                await apiAddVacation(vacation);
                                results.vacations++;
                            } catch(e) { console.error('Ошибка:', e); }
                            completed++;
                            progressBar.style.width = `${(completed / total) * 100}%`;
                            progressText.textContent = `Импорт: ${results.journal} записей журнала, ${results.vacations} отпусков, ${results.birthdays} сотрудников`;
                        }
                    }
                    
                    // Импорт дней рождения
                    if (data.data && data.data.birthdays) {
                        for (let birthday of data.data.birthdays) {
                            try {
                                await apiAddBirthday(birthday);
                                results.birthdays++;
                            } catch(e) { console.error('Ошибка:', e); }
                            completed++;
                            progressBar.style.width = `${(completed / total) * 100}%`;
                            progressText.textContent = `Импорт: ${results.journal} записей журнала, ${results.vacations} отпусков, ${results.birthdays} сотрудников`;
                        }
                    }
                    
                    progressBar.classList.remove('progress-bar-animated');
                    progressBar.classList.add('bg-success');
                    progressText.innerHTML = '<strong>✅ Импорт завершён!</strong>';
                    resultDiv.innerHTML = `<strong class="text-success">Готово!</strong><br>
                        📋 Журнал: ${results.journal} записей<br>
                        🏖️ Отпуска: ${results.vacations} записей<br>
                        🎂 Дни рождения: ${results.birthdays} сотрудников<br>
                        <hr><a href="/journal.html" class="btn btn-sm btn-primary mt-2">Перейти к журналу</a>
                        <a href="/vacation.html" class="btn btn-sm btn-success mt-2">Перейти к отпускам</a>
                        <a href="/birthdays.html" class="btn btn-sm btn-info mt-2 text-white">Перейти к дням рождения</a>`;
                    
                } catch (error) {
                    console.error('Ошибка:', error);
                    resultDiv.innerHTML = `<strong class="text-danger">Ошибка импорта: ${error.message}</strong>`;
                    progress.style.display = 'none';
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
