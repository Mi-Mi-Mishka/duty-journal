<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Схемы оборудования</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .schema-card {
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border-radius: 16px;
            overflow: hidden;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .schema-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .schema-card .card-body {
            padding: 1.5rem;
            text-align: center;
        }
        .schema-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--corporate-teal);
        }
        .schema-icon i {
            background: var(--corporate-teal-light);
            padding: 1rem;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .schema-card:hover .schema-icon i {
            background: var(--corporate-teal);
            color: white;
        }
        .schema-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }
        .schema-desc {
            color: #6c757d;
            font-size: 0.85rem;
        }
        .schema-badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-journal-text me-2"></i>Журнал дежурного персонала</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/journal.html"><i class="bi bi-journal-bookmark-fill me-1"></i>Журнал дежурств</a></li>
                <li class="nav-item"><a class="nav-link" href="/birthdays.html"><i class="bi bi-gift me-1"></i>Дни рождения</a></li>
                <li class="nav-item"><a class="nav-link active" href="/schemas.html"><i class="bi bi-diagram-3 me-1"></i>Схемы оборудования</a></li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <span class="nav-link text-white">
                        <i class="bi bi-person-badge me-1"></i>
                        Текущий дежурный: <strong id="currentStaffDisplay">Загрузка...</strong>
                    </span>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-3">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="h4 mb-0">
                <i class="bi bi-diagram-3 me-2 text-primary"></i>
                Схемы оборудования
            </h2>
            <p class="text-muted small">Нажмите на схему, чтобы открыть в новой вкладке</p>
        </div>
    </div>

    <div class="row g-4" id="schemasGrid">
        <!-- Карточки загружаются через JavaScript -->
    </div>
</div>

<!-- Модальное окно предпросмотра -->
<div class="modal fade" id="schemaModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="schemaModalTitle">Схема</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0" style="height: 80vh;">
                <iframe id="schemaIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/schemas.js"></script>
</body>
